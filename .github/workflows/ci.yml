name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog filesystem tip scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version
      - name: Scan for secrets
        run: |
          set -euo pipefail
          cat > /tmp/th-exclude <<'EOF'
          (^|/)(node_modules|vendor|dist|build|\.git)(/|$)
          (^|/)package-lock\.json$
          (^|/)composer\.lock$
          (^|/)google-services\.json$
          (^|/)_wildcard\.localhost.*-key\.pem$
          (^|/)openpgp\.js$
          (^|/)(\.agents/vendor-src)(/|$)
          EOF
          trufflehog filesystem . \
            --fail \
            --no-update \
            --exclude-paths=/tmp/th-exclude \
            --results=verified,unknown

  repo-boot-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure repository boot markdown
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          total = 0
          for name in ("CLAUDE.md", "AGENTS.md"):
              path = Path(name)
              if path.is_symlink():
                  raise SystemExit(f"unsupported root-doc symlink: {path}")
              if not path.exists():
                  continue
              raw = path.read_bytes()
              text = raw.decode("utf-8", errors="replace")
              total += int(max(len(text.encode("utf-8")) / 4.0, len(text.split()) / 0.75))

          print(f"repo boot estimate: {total:,} tokens (budget 100,000)")
          if total > 100_000:
              raise SystemExit("repo boot markdown exceeds 100,000-token budget")
          PY

  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.5' ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: JSON syntax
        run: |
          for f in $(find blocks -name '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "bad JSON: $f"; exit 1; }
          done

      - name: JavaScript syntax
        run: node --check assets/js/blocks.js

  package:
    name: The plugin package is shippable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: ./scripts/package.sh --check
