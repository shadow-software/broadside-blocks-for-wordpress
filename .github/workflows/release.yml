name: Release

# On a version tag, build the lean installable ZIP and publish a GitHub Release
# with notes — in parallel to the WordPress.org deploy (deploy.yml), and
# independent of it. This is the download a self-hosted store installs directly
# via Plugins → Add New → Upload, without waiting on the wp.org directory or
# needing SVN credentials.
#
# Trigger: push a version tag, e.g.
#   git tag 1.3.3 && git push origin 1.3.3
# The tag MUST equal readme.txt's "Stable tag", the plugin header "Version:", and
# the BROADSIDE_BLOCKS_VERSION constant — the build fails loudly if they disagree.
#
# Also accepts a leading "v" (v1.3.3) for historical tags; the version is normalized.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ZIP and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the version
        id: version
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          version="${raw#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "raw=${raw}" >> "$GITHUB_OUTPUT"
          echo "Building release for version: ${version}"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify the tag matches the plugin version everywhere
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.version }}"

          header="$(grep -oE '^\s*\*\s*Version:\s*\S+' broadside-blocks.php | awk '{print $NF}')"
          const="$(grep -oE "BROADSIDE_BLOCKS_VERSION',\s*'[^']+'" broadside-blocks.php | grep -oE "'[0-9][^']*'" | tr -d "'")"
          stable="$(grep -oE '^Stable tag:\s*\S+' readme.txt | awk '{print $NF}')"

          echo "tag=${tag}  header=${header}  const=${const}  stable_tag=${stable}"

          fail=0
          [ "$header" = "$tag" ] || { echo "::error::Plugin header Version ($header) != tag ($tag)"; fail=1; }
          [ "$const"  = "$tag" ] || { echo "::error::BROADSIDE_BLOCKS_VERSION ($const) != tag ($tag)"; fail=1; }
          [ "$stable" = "$tag" ] || { echo "::error::readme.txt Stable tag ($stable) != tag ($tag)"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            echo "::error::Version mismatch. Bump every place to ${tag} before tagging."
            exit 1
          fi

      - name: Build and verify the package
        run: ./scripts/package.sh

      - name: Extract this version's changelog
        run: |
          ver="${{ steps.version.outputs.version }}"
          {
            echo "## Broadside Blocks ${ver}"
            echo
            awk -v v="= ${ver} =" '
              $0 == v     { on = 1; next }
              on && /^= / { exit }
              on          { print }
            ' readme.txt
            echo
            echo '---'
            echo
            echo 'Install with **Plugins → Add New → Upload Plugin**, or let WordPress offer it'
            echo 'when you activate the [Broadside theme](https://github.com/shadow-software/broadside-theme-for-wordpress).'
            echo
            echo "**Also on WordPress.org:** https://wordpress.org/plugins/broadside-blocks/"
          } > NOTES.md
          cat NOTES.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.version.outputs.version }}"
          raw="${{ steps.version.outputs.raw }}"
          # Prefer the pushed tag name; if workflow_dispatch passed a plain version, use it.
          tag_name="$raw"
          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "Release $tag_name already exists — replacing assets."
            gh release upload "$tag_name" build/*.zip --clobber
          else
            gh release create "$tag_name" \
              build/*.zip \
              --title "Broadside Blocks ${ver}" \
              --notes-file NOTES.md
          fi
